# agos guest image: Debian 13 (trixie) UEFI disk image with an XFCE desktop on
# KasmVNC, configured at first boot from cloud-init / AGOS / credentials.
# Contract: docs/spec.md ("Guest image", "Configuration contract").
#
# Build via the builder container: make -C image build ARCH=amd64
# Architecture-specific bits live in mkosi.conf.d/; the optional agent CLIs in
# mkosi.profiles/agents.conf (enabled by default below).

[Config]
MinimumVersion=27.1
Profiles=agents

[Distribution]
Distribution=debian
Release=trixie
Repositories=contrib,non-free-firmware

[Output]
ImageId=agos
Format=disk
CompressOutput=no
ManifestFormat=json
# Only the disk image; kernel/initrd/UKI stay inside the ESP.
SplitArtifacts=

[Build]
# The pinned builder container (image/builder/Dockerfile) is the tools tree.
ToolsTree=no
# Package and incremental caches on the bind-mounted source tree (gitignored),
# so repeated container runs reuse downloads. The workspace defaults to
# /var/tmp, which the Makefile backs with a Docker volume (it may not live
# inside a build source directory).
CacheDirectory=mkosi.cache
PackageCacheDirectory=.cache/pkgcache
Incremental=yes
# Postinst scripts install agentd (pip) and need the network.
WithNetwork=yes
# The whole repository at /work/src (image/ and agentd/ side by side); a
# nested target such as ../agentd:agentd would make mkosi create an empty
# mountpoint directory inside image/.
BuildSources=..
Environment=AGOS_WITH_AGENTD
            AGOS_VERSION

[Content]
Bootable=yes
Bootloader=systemd-boot
# "yes" would mean "signed" (a distro pre-built UKI); we build our own.
UnifiedKernelImages=unsigned
# mkosi builds a systemd-based initrd for the UKI. initramfs-tools is still
# installed (the kernel package depends on it) so that kernels arriving later
# through unattended-upgrades get a bootable Type #1 entry via kernel-install.
WithRecommends=no
WithDocs=no
Locale=C.UTF-8
Keymap=us
Timezone=Etc/UTC
Hostname=agos
# Kernel modules in the UKI's initrd: mkosi's curated boot set (virtio, nvme,
# ahci, ext4, vfat, ...) plus Hyper-V/VMware/Xen storage, instead of every
# module (which made the UKI ~130 MB and slowed firmware loading).
KernelInitrdModules=default
                    hv_vmbus
                    hv_storvsc
                    vmw_pvscsi
                    mptspi
                    xen-blkfront
# The full kernel command line is /etc/kernel/cmdline (written by
# mkosi.postinst.chroot per architecture) so mkosi's UKI and kernel-install
# entries for future kernels agree.

Packages=
        # base system
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        systemd-repart
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        dbus-user-session
        libpam-systemd
        kmod
        initramfs-tools
        e2fsprogs
        dosfstools
        util-linux
        procps
        psmisc
        iproute2
        iputils-ping
        netbase
        ca-certificates
        openssl
        gnupg
        apt
        tzdata
        locales
        sudo
        polkitd
        openssh-server
        openssh-client
        cloud-init
        qemu-guest-agent
        unattended-upgrades
        # tools agents expect
        bash-completion
        curl
        wget
        file
        less
        nano
        vim-tiny
        tmux
        htop
        lsof
        rsync
        ripgrep
        xz-utils
        zstd
        zip
        unzip
        git
        jq
        python3
        python3-venv
        python3-pip
        python3-gi
        gir1.2-atspi-2.0
        at-spi2-core
        nodejs
        npm
        # display and desktop
        kasmvncserver
        xauth
        xfonts-base
        xfce4-session
        xfwm4
        xfce4-panel
        xfdesktop4
        xfce4-settings
        xfconf
        xfce4-terminal
        xfce4-notifyd
        xfce4-appfinder
        libxfce4ui-utils
        thunar
        adwaita-icon-theme
        elementary-xfce-icon-theme
        desktop-base
        xdg-utils
        desktop-file-utils
        shared-mime-info
        fonts-dejavu-core
        fonts-liberation
        fonts-noto-core
        fonts-noto-color-emoji
        # small CJK fallback so CJK pages are not tofu in screenshots
        fonts-droid-fallback
        # GUI automation
        x11-xserver-utils
        x11-utils
        xdotool
        xclip
        wmctrl
        ffmpeg
        # X11 from Python (also agos' window placement helper, pin-workspace)
        python3-xlib
        # browsers
        chromium
        chromium-sandbox
        firefox-esr
        # remote access
        tailscale

# Never let these in, even as dependencies of later additions to the list.
RemovePackages=
        needrestart
        gnome-keyring
        light-locker
        xscreensaver
        xfce4-screensaver
        xfce4-power-manager

RemoveFiles=
        # generated at build time; must be unique per machine (agos-ssh-keygen / firstboot)
        /etc/ssh/ssh_host_*
        /etc/ssl/private/ssl-cert-snakeoil.key
        /etc/ssl/certs/ssl-cert-snakeoil.pem
        /var/lib/dbus/machine-id
        /var/log/*.log
        /var/cache/debconf/*-old
