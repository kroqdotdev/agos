# x86-64 (Debian: amd64). EFI fallback loader EFI/BOOT/BOOTX64.EFI is installed
# by bootctl --all-architectures; boot-tested with OVMF.
[Match]
Architecture=x86-64

[Output]
Output=agos-%v-amd64

[Content]
Packages=
        linux-image-amd64
        # microcode is not useful in a VM guest and pulls in non-free firmware
