# AArch64 (Debian: arm64). EFI fallback loader EFI/BOOT/BOOTAA64.EFI; boots on
# QEMU+AAVMF, Proxmox arm64, UTM/QEMU, Graviton/Ampere. Debian's arm64 kernel
# uses 4K pages, which UTM's Apple Virtualization backend also accepts.
[Match]
Architecture=arm64

[Output]
Output=agos-%v-arm64

[Content]
Packages=
        linux-image-arm64
