# agos cloud-init defaults (spec: "Configuration contract").
# Datasources probed by ds-identify; without a match cloud-init stays disabled
# and agos-firstboot works from /etc/agos, an AGOS filesystem or credentials.
datasource_list: [NoCloud, ConfigDrive, VMware, Ec2, GCE, Azure, Hetzner, DigitalOcean, OpenStack]

system_info:
  default_user:
    name: agent
    gecos: agos agent
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    # /etc/sudoers.d/agos already grants NOPASSWD; avoid a duplicate rule
    sudo: false
  network:
    # systemd-networkd is the image's only network stack
    renderers: [networkd]
    activators: [networkd]

# keys only (sshd_config.d/10-agos.conf enforces it as well)
ssh_pwauth: false
disable_root: true
# hostname from meta-data goes into /etc/hosts so sudo never warns about it
manage_etc_hosts: true
# keep the image's deb822 sources; cloud-init would otherwise write a second copy
apt:
  preserve_sources_list: true
