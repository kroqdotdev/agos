[Login]
# An unattended VM must never suspend: ignore lid/suspend/hibernate keys and idleness.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
# The power key stays "poweroff" so hypervisor ACPI shutdown keeps working.
# Lingering user manager: keep the agent's processes when an SSH login ends.
KillUserProcesses=no
