# agos: environment of the agent's systemd user manager (desktop, agentd and
# everything launched from them).
DISPLAY=:1
# prevents git from prompting for credentials on the terminal (hangs agents)
GIT_TERMINAL_PROMPT=0
GCM_INTERACTIVE=never
# prevents pip/npm confirmation prompts
PIP_NO_INPUT=1
npm_config_yes=true
# Qt apps expose AT-SPI accessibility without a screen reader running
QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
