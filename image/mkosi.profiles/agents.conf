# Profile "agents" (on by default, see mkosi.conf [Config] Profiles=):
# agent CLIs and apps installed system-wide so they work offline at first boot.
# Claude Code comes from Anthropic's signed apt repository (stable channel),
# so it is updated by apt/unattended-upgrades like every other package.
# T3 Code (desktop app) is the pinned AppImage unpacked to /opt/t3code by
# mkosi.postinst.chroot; the libraries below are exactly the Depends of the
# vendor's own .deb for the same release.
[Content]
Packages=
        claude-code
        # T3 Code (Electron) runtime
        libasound2t64
        libatspi2.0-0t64
        libgbm1
        libgtk-3-0t64
        libnotify4
        libnss3
        libsecret-1-0
        libuuid1
        libxss1
        libxtst6
        xdg-utils
