# EFI system partition: systemd-boot, the UKI, and room for a few
# kernel-install entries (kernel + initramfs-tools initrd) from later updates.
[Partition]
Type=esp
Label=esp
Format=vfat
# Only what boots: mkosi's UKIs/loader files from /boot and systemd-boot from
# /efi (not the build-time vmlinuz/config/System.map copies).
CopyFiles=/boot/EFI:/EFI
CopyFiles=/boot/loader:/loader
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
