# Root filesystem. Minimal at build time; systemd-repart grows the partition
# to fill the disk at boot (usr/lib/repart.d/ in the image) and
# systemd-growfs then grows ext4 (GrowFileSystem=yes sets the GPT flag;
# /etc/fstab also carries x-systemd.growfs).
[Partition]
Type=root
Label=agos-root
Format=ext4
CopyFiles=/
Minimize=guess
GrowFileSystem=yes
